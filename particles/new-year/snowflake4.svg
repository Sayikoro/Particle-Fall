<svg viewBox="-120 -120 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="ray4">
      <!-- основной луч -->
      <line x1="0" y1="0" x2="0" y2="-100" stroke="#f06292" stroke-width="3" stroke-linecap="round"/>
      <!-- боковые ответвления -->
      <path d="M0,-20 Q-25,-30 -20,-50" fill="none" stroke="#f06292" stroke-width="2"/>
      <path d="M0,-20 Q25,-30 20,-50" fill="none" stroke="#f06292" stroke-width="2"/>
      <path d="M0,-50 Q-18,-60 -15,-75" fill="none" stroke="#f06292" stroke-width="1.5"/>
      <path d="M0,-50 Q18,-60 15,-75" fill="none" stroke="#f06292" stroke-width="1.5"/>
      <path d="M0,-75 Q-10,-85 -8,-95" fill="none" stroke="#f06292" stroke-width="1"/>
      <path d="M0,-75 Q10,-85 8,-95" fill="none" stroke="#f06292" stroke-width="1"/>
      <!-- наконечник -->
      <circle cx="0" cy="-100" r="5" fill="#f06292"/>
    </g>
  </defs>
  <circle cx="0" cy="0" r="8" fill="#f06292"/>
  <!-- 12 поворотов через 30° -->
  <use href="#ray4" transform="rotate(0)"/>
  <use href="#ray4" transform="rotate(30)"/>
  <use href="#ray4" transform="rotate(60)"/>
  <use href="#ray4" transform="rotate(90)"/>
  <use href="#ray4" transform="rotate(120)"/>
  <use href="#ray4" transform="rotate(150)"/>
  <use href="#ray4" transform="rotate(180)"/>
  <use href="#ray4" transform="rotate(210)"/>
  <use href="#ray4" transform="rotate(240)"/>
  <use href="#ray4" transform="rotate(270)"/>
  <use href="#ray4" transform="rotate(300)"/>
  <use href="#ray4" transform="rotate(330)"/>
</svg>